# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  # ==================== INFRASTRUCTURE ====================
  postgres-main:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  rabbitmq:
    restart: unless-stopped

  # ==================== API GATEWAY ====================
  api-gateway:
    restart: unless-stopped
    # No volume mount in production — use baked-in code
    volumes: []

  # ==================== BACKEND MICROSERVICES ====================
  auth-service:
    restart: unless-stopped
    environment:
      - DEBUG=False
    # No volume mounts in production
    volumes: []

  course-service:
    restart: unless-stopped
    environment:
      - DEBUG=False
    volumes: []

  admission-service:
    restart: unless-stopped
    environment:
      - DEBUG=False
    volumes: []

  notification-service:
    restart: unless-stopped
    environment:
      - DEBUG=False
    volumes: []

  certification-service:
    restart: unless-stopped
    environment:
      - DEBUG=False
    volumes: []

  content-service:
    restart: unless-stopped
    environment:
      - DEBUG=False
    volumes: []

  # ==================== FRONTENDS ====================
  ait-frontend:
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  lms-frontend:
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  # ==================== NGINX ====================
  nginx:
    restart: unless-stopped
