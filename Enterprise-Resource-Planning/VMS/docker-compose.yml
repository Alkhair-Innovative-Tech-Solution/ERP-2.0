services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vms_db
      POSTGRES_USER: vms_user
      POSTGRES_PASSWORD: vms_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms_user -d vms_db"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      default:
        aliases:
          - vms-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: bash /app/entrypoint.sh
    # Issue #10: load .env file for email credentials
    env_file:
      - ./backend/.env
    environment:
      # These override .env so docker networking works
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: vms-redis
      ALLOWED_HOSTS: "vms.idaraalkhair.sbs,localhost,127.0.0.1,backend,nginx"
      CORS_ALLOWED_ORIGINS: "https://vms.idaraalkhair.sbs,http://localhost,http://localhost:3000"
      PGPASSWORD: vms_password
      AUTH_SERVICE_URL: http://auth-service:8000
      AUTH_SERVICE_TIMEOUT: "5"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - erp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      - backend
      - frontend
    networks:
      - default
      - erp_network

volumes:
  postgres_data:
  media_files:
  static_files:

networks:
  default:
    driver: bridge
  erp_network:
    external: true  # Created by erp_new/docker-compose.infra.yml
