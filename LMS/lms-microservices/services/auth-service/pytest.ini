[pytest]
DJANGO_SETTINGS_MODULE = auth_service.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --reuse-db
    --nomigrations
testpaths = tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
