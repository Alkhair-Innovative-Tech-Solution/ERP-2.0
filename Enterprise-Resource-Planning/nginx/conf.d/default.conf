server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 _;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 500M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Django admins
    location /auth-admin/ {
        set $u http://auth_service:8000;
        proxy_pass $u;
    }

    location /ticket-admin/ {
        set $u http://hdms-ticket-service:8002;
        proxy_pass $u;
    }

    location /chat-admin/ {
        set $u http://hdms-communication-service:8003;
        proxy_pass $u;
        proxy_set_header X-Forwarded-Prefix /chat-admin;
    }

    location /file-admin/ {
        set $u http://hdms-file-service:8005;
        proxy_pass $u;
        proxy_set_header X-Forwarded-Prefix /file-admin;
    }

    # WebSocket
    location /ws/ {
        set $u http://hdms-communication-service:8003;
        proxy_pass $u;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # HDMS frontend (catch-all — Next.js handles /api/* internally)
    location / {
        set $u http://hdms-frontend-service:3000;
        proxy_pass $u;
    }
}
