# hrms.idaraalkhair.sbs → Auth-service (backend + frontend)
server {
    listen 80;
    server_name hrms.idaraalkhair.sbs;

    # Docker internal DNS — resolves container names at request time, not startup
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    client_max_body_size 50M;

    add_header X-Content-Type-Options  "nosniff"                  always;
    add_header X-Frame-Options         "SAMEORIGIN"               always;
    add_header X-XSS-Protection        "1; mode=block"            always;
    add_header Referrer-Policy         "no-referrer-when-downgrade" always;

    # Common proxy headers (HAProxy already set X-Forwarded-Proto: https)
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # Django admin — office/LAN only
    location /auth-admin/ {
        allow 10.0.0.0/8;
        deny all;

        set $auth http://auth_service:8000;
        proxy_pass $auth;
    }

    # Auth backend API (login, refresh, employees, permissions, audit)
    location /api/ {
        set $auth http://auth_service:8000;
        proxy_pass $auth;
    }

    # Auth frontend (Next.js — login panel, employee management UI)
    location / {
        set $frontend http://auth_frontend:3000;
        proxy_pass $frontend;
    }

    location /health/ {
        return 200 'hrms ok\n';
        add_header Content-Type text/plain;
    }
}
