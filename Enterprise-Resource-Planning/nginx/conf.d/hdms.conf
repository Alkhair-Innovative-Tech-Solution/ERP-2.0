# hdms.idaraalkhair.sbs → HDMS (frontend handles /api/* rewrites internally)
server {
    listen 80;
    server_name hdms.idaraalkhair.sbs;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    client_max_body_size 500M;

    add_header X-Content-Type-Options  "nosniff"                  always;
    add_header X-Frame-Options         "SAMEORIGIN"               always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "no-referrer-when-downgrade" always;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # WebSocket — direct to communication-service (Next.js does NOT proxy WS)
    location /ws/ {
        set $comm http://hdms-communication-service:8003;
        proxy_pass $comm;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;   # keep WS alive
    }

    # Django admin panels — office/LAN only
    location /ticket-admin/ {
        allow 10.0.0.0/8;
        deny all;

        set $ticket http://hdms-ticket-service:8002;
        proxy_pass $ticket;
    }

    location /chat-admin/ {
        allow 10.0.0.0/8;
        deny all;

        set $comm http://hdms-communication-service:8003;
        proxy_pass $comm;
        proxy_set_header X-Forwarded-Prefix /chat-admin;
    }

    location /file-admin/ {
        allow 10.0.0.0/8;
        deny all;

        set $file http://hdms-file-service:8005;
        proxy_pass $file;
        proxy_set_header X-Forwarded-Prefix /file-admin;
    }

    # Everything else → Next.js frontend
    # Next.js next.config.ts handles:
    #   /api/v1/tickets/*  → hdms-ticket-service:8002
    #   /api/v1/chat/*     → hdms-communication-service:8003
    #   /api/v1/files/*    → hdms-file-service:8005
    #   /api/auth/*        → auth_service:8000
    location / {
        set $frontend http://hdms-frontend-service:3000;
        proxy_pass $frontend;
    }

    location /health/ {
        return 200 'hdms ok\n';
        add_header Content-Type text/plain;
    }
}
