  # Frontends
  ait-frontend:
    build:
      context: ../ait_fe
      dockerfile: Dockerfile.dev
    container_name: ait-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
    networks:
      - lms-network
    depends_on:
      - api-gateway

  lms-frontend:
    build:
      context: ../lms_fe
      dockerfile: Dockerfile.dev
    container_name: lms-frontend
    ports:
      - "3001:3000"
    volumes:
      - ../Lms_fe:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    networks:
      - lms-network
    depends_on:
      - api-gateway

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ait-frontend
      - api-gateway
    networks:
      - lms-network

volumes:
  postgres-auth-data-v2:
  postgres-course-data-v2:
  postgres-admission-data-v2:
  postgres-notification-data-v2:
  postgres-certification-data-v2:
  postgres-content-data-v2:
  postgres-social-data-v2:
  postgres-job-data-v2:
  redis-data-v2:
  rabbitmq-data:


networks:
  lms-network:
    driver: bridge
