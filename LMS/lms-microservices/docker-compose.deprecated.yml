  #   depends_on:
  #     postgres-social:
  #       condition: service_healthy
  #     auth-service:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - lms-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Job Service (commented out - Dockerfile not yet created)
  # job-service:
  #   build:
  #     context: .
  #     dockerfile: ./services/job-service/Dockerfile
  #   image: lms-job-service:latest
  #   container_name: job-service
  #   ports:
  #     - "8007:8007"
  #   environment:
  #     - DATABASE_URL=postgresql://lms_user:lms_password@postgres-job:5432/job_db
  #     - AUTH_SERVICE_URL=http://auth-service:8001
  #     - REDIS_URL=redis://redis:6379/7
  #     - DEBUG=True
  #   depends_on:
  #     postgres-job:
  #       condition: service_healthy
  #     auth-service:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - lms-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
  #     interval: 10s
  #     timeout: 5s
