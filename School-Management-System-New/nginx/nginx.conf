user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=60r/m;

# ─── HTTP — Development ───────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;

    client_max_body_size 210M;
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "DENY"                                 always;

    # CORS headers only needed on nginx-generated error pages (502/503/504).
    # Regular proxied responses get CORS headers from Django's corsheaders middleware.
    error_page 502 503 504 = @backend_error;
    location @backend_error {
        add_header 'Access-Control-Allow-Origin'  $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true'   always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
        return 502;
    }

    # Phase D-R6: /sms-admin/ (auth-8001's own Django admin) removed —
    # auth-8001 no longer exists (D-R5). See
    # docs/PHASE_D_R4R6_REMOVAL_RESULT.md.

    # ── Django Admin — one route per service (each service mounts its own
    #    admin at /<service>-admin/, static served by whitenoise under the
    #    same prefix, so no path rewriting is needed) ─────────────────────────
    location /org-admin/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /campus-admin/ {
        set $svc "campus-service:8003";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /staff-admin/ {
        set $svc "staff-service:8004";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /student-admin/ {
        set $svc "student-service:8005";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /attendance-admin/ {
        set $svc "attendance-service:8006";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /result-admin/ {
        set $svc "result-service:8007";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /fees-admin/ {
        set $svc "fees-service:8008";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /timetable-admin/ {
        set $svc "timetable-service:8009";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /notification-admin/ {
        set $svc "notification-service:8010";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /support-admin/ {
        set $svc "support-service:8011";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /subject-admin/ {
        set $svc "subject-service:8012";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /content-admin/ {
        set $svc "content-service:8013";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # Phase D-R6 follow-up: /api/auth/login/ (org-service's own
    # UserLoginView, minted HS256 tokens) is gone for good — that view was
    # deleted (dead-in-practice, HS256 retired). But everything else that
    # used to route here to the now-removed auth-service:8001 — profile,
    # users, permissions, current-user, and the password-reset/OTP routes —
    # turned out to be LIVE, working views already implemented in
    # org-service (users/urls.py, mounted under org-service's own /api/),
    # just unreachable through the gateway since D-R1/R3 pointed them at
    # the wrong (dead) backend. Repointed to org-service:8002 instead of
    # being deleted. /api/version/ and /api/sidebar-badges/ are the only
    # two from the original auth-8001 route list with NO live backend
    # anywhere (auth-service-only, confirmed via repo-wide grep) — those
    # stay removed; their frontend calls were deleted separately. See
    # docs/PHASE_D_R4R6_REMOVAL_RESULT.md.
    location /api/plans/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/profile/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/current-user/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/users/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/permissions/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/first-login-change-password/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/check-password-change-required/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/send-password-change-otp/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/verify-password-change-otp/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/change-password-with-otp/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/send-forgot-password-otp/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/verify-forgot-password-otp/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/reset-password-with-otp/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/student-direct-change-password/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── Org ───────────────────────────────────────────────────────────────────
    location /api/organizations/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    location /api/invoices/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    location /org-media/ {
        set $svc "org-service:8002";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── Campus ────────────────────────────────────────────────────────────────
    location /api/campus/ {
        set $svc "campus-service:8003";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/classes/ {
        set $svc "campus-service:8003";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/classrooms/ {
        set $svc "campus-service:8003";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/levels/ {
        set $svc "campus-service:8003";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/grades/ {
        set $svc "campus-service:8003";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── Staff ─────────────────────────────────────────────────────────────────
    location /api/teachers/ {
        set $svc "staff-service:8004";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/coordinators/ {
        set $svc "staff-service:8004";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/principals/ {
        set $svc "staff-service:8004";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── Students ──────────────────────────────────────────────────────────────
    location /api/students/ {
        set $svc "student-service:8005";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/behaviour/ {
        set $svc "student-service:8005";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── Attendance + Biometric ───────────────────────────────────────────────────
    location /api/attendance/ {
        set $svc "attendance-service:8006";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /iclock/ {
        set $svc "attendance-service:8006";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── Result ────────────────────────────────────────────────────────────────
    location /api/result/ {
        set $svc "result-service:8007";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/results/ {
        set $svc "result-service:8007";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    location /api/retest/ {
        set $svc "result-service:8007";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── Fees ──────────────────────────────────────────────────────────────────
    location /api/fees/ {
        set $svc "fees-service:8008";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── Timetable + Transfers ─────────────────────────────────────────────────
    location /api/timetable/ {
        set $svc "timetable-service:8009";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/transfers/ {
        set $svc "timetable-service:8009";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── Notifications ─────────────────────────────────────────────────────────
    location /api/notifications/ {
        set $svc "notification-service:8010";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # Announcements + Web Push live in the notification-service too (mounted at /api/)
    location /api/announcements/ {
        set $svc "notification-service:8010";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    location /api/push/ {
        set $svc "notification-service:8010";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws/ {
        set $svc "notification-service:8010";
        proxy_pass         http://$svc;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_read_timeout 86400s;
    }

    # ── Subject + Content (LMS features) ─────────────────────────────────────
    location /api/subjects/ {
        set $svc "subject-service:8012";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/subject-teacher-assignments/ {
        set $svc "subject-service:8012";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/assignments/ {
        set $svc "subject-service:8012";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /media/assignments/ {
        set $svc "subject-service:8012";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /media/submissions/ {
        set $svc "subject-service:8012";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    # Staff profile photos are served by staff-service
    location /media/principals/ {
        set $svc "staff-service:8004";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /media/teachers/ {
        set $svc "staff-service:8004";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /media/coordinators/ {
        set $svc "staff-service:8004";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/my-submissions/ {
        set $svc "subject-service:8012";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/content/ {
        set $svc "content-service:8013";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── AI Chat ───────────────────────────────────────────────────────────────
    # AI chat — browser hits Next.js API routes which proxy to ai-service directly.
    # This block kept for direct/internal access; SSE-friendly (no buffering).
    location /api/ai/ {
        set $svc "ai-service:8014";
        proxy_pass      http://$svc;
        proxy_buffering off;
        proxy_cache     off;
        include /etc/nginx/proxy_params;
    }

    # ── Support ───────────────────────────────────────────────────────────────
    location /api/requests/ {
        set $svc "support-service:8011";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }
    location /api/form-builder/ {
        set $svc "support-service:8011";
        proxy_pass http://$svc;
        include /etc/nginx/proxy_params;
    }

    # ── Health checks ─────────────────────────────────────────────────────────
    # Phase D-R6: /health/auth/ removed — auth-8001 no longer exists (D-R5).
    location /health/attendance/ {
        set $svc "attendance-service:8006";
        proxy_pass http://$svc/health/;
    }
    location /health/student/ {
        set $svc "student-service:8005";
        proxy_pass http://$svc/health/;
    }

    # ── Frontend catch-all ────────────────────────────────────────────────────
    location / {
        set $svc "frontend:3000";
        proxy_pass         http://$svc;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

} # end http
