name: Deploy Infrastructure & Nginx

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          cd /var/www/erp_new
          git checkout -- .env 2>/dev/null || true
          git pull origin master
          docker compose -f docker-compose.infra.yml up -d
          docker exec erp-edge-nginx nginx -s reload
          echo "Infrastructure deployed successfully"
