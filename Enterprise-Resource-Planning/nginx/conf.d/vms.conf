# vms.idaraalkhair.sbs → Visitor Management System
server {
    listen 80;
    server_name vms.idaraalkhair.sbs;

    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    client_max_body_size 50M;

    add_header X-Content-Type-Options  "nosniff"                  always;
    add_header X-Frame-Options         "SAMEORIGIN"               always;
    add_header X-XSS-Protection        "1; mode=block"            always;
    add_header Referrer-Policy         "no-referrer-when-downgrade" always;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;

    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # Routes to VMS's own nginx (which handles frontend + backend routing internally)
    # Requires: VMS nginx container on erp_network (see visitor-management-system/docker-compose.yml)
    location / {
        set $vms http://vms-nginx-1:80;
        proxy_pass $vms;
    }

    location /health/ {
        return 200 'vms ok\n';
        add_header Content-Type text/plain;
    }
}
