name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ── Step 1: Checkout ────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: SSH → Server → Pull → Build → Up ────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd ${{ secrets.SERVER_PATH }}

            echo ">>> Fetching latest code and resetting server state..."
            git fetch https://${{ secrets.GH_PAT }}@github.com/Alkhair-Innovative-Tech-Solution/School-Management-System.git main
            git reset --hard FETCH_HEAD

            echo ">>> Rebuilding and restarting containers..."
            docker compose up --build -d

            
            echo ">>> Cleaning unused images..."
            docker image prune -f

            echo ">>> Container status:"
            docker compose ps

      # ── Step 3: Wait for containers to be ready ──────────────────────────────
      - name: Wait for server to be ready
        run: sleep 40

      # ── Step 4: Health Check ─────────────────────────────────────────────────
      - name: Health Check
        run: |
          curl --fail --silent --show-error \
            ${{ secrets.HEALTH_CHECK_URL }}/api/health/ \
            || (echo "Health check failed!" && exit 1)

      # ── Step 5: Notify success ───────────────────────────────────────────────
      - name: Deployment successful
        run: echo "✓ Deploy complete — ${{ github.sha }}"
